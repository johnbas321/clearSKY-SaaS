<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clearSKY Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #eef2f3, #8e9eab);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
    }
    .login-card {
      max-width: 400px;
      margin: auto;
      margin-top: 5rem;
    }
    footer {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <header class="bg-dark text-white text-center py-4">
    <h1>clearSKY</h1>
    <p class="lead">Your academic grade management service</p>
  </header>

  <main>
    <div class="card login-card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3 text-center">Login</h4>
        <form id="loginForm">
          <div class="mb-3">
            <input type="email" class="form-control" id="email" placeholder="Email" required />
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="password" placeholder="Password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
          <div id="errorMsg" class="text-danger mt-2"></div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 clearSKY SaaS. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (!email || !password) {
        errorMsg.textContent = 'Please fill out both fields.';
        return;
      }

      errorMsg.textContent = '';
      alert(`Logging in as: ${email}`);

      try {
          const res = await fetch('http://localhost:3001/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();
          if (res.ok) {
            alert('Login successful!');
            window.location.href = '/grade-stats.html'; // You create this page
          } else {
            alert(data.message || 'Login failed');
          }
        } catch (err) {
          alert('Network error');
        }
    });
  </script>

  <script src="script.js"></script>
</body>
</html>
