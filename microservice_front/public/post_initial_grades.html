<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Grades – clearSKY</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #eef2f3, #8e9eab);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
    }
    .upload-card {
      max-width: 500px;
      margin: auto;
      margin-top: 5rem;
    }
    footer {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <header class="bg-dark text-white text-center py-4">
    <h1>clearSKY</h1>
    <p class="lead">Instructor Panel – Upload Initial Grades</p>
  </header>

  <main>
    <div class="card upload-card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3 text-center">Upload Grades</h4>
        <form id="uploadForm">
          <div class="mb-3">
            <label for="courseName" class="form-label">Course Name</label>
            <input type="text" class="form-control" id="courseName" required />
          </div>
          <div class="mb-3">
            <label for="examPeriod" class="form-label">Examination Period</label>
            <select class="form-select" id="examPeriod" required>
              <option value="">Select period</option>
              <option value="January">January</option>
              <option value="June">June</option>
              <option value="September">September</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="numGrades" class="form-label">Number of Grades</label>
            <input type="number" class="form-control" id="numGrades" min="1" required />
          </div>
          <div class="mb-3">
            <label for="gradeFile" class="form-label">Upload Excel File (.xlsx)</label>
            <input type="file" class="form-control" id="gradeFile" accept=".xlsx" required />
          </div>
          <button type="submit" class="btn btn-success w-100">Submit</button>
          <div id="uploadMsg" class="text-danger mt-2"></div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 clearSKY SaaS. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('uploadForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const course = document.getElementById('courseName').value.trim();
      const period = document.getElementById('examPeriod').value;
      const num = document.getElementById('numGrades').value;
      const file = document.getElementById('gradeFile').files[0];
      const msg = document.getElementById('uploadMsg');

      if (!course || !period || !num || !file) {
        msg.textContent = 'All fields are required.';
        return;
      }

      if (!file.name.endsWith('.xlsx')) {
        msg.textContent = 'Only .xlsx files are allowed.';
        return;
      }

      msg.textContent = '';
      alert(`File "${file.name}" ready for upload for course "${course}" (${period}) with ${num} grades.`);
      // You can replace this with actual file upload logic (e.g., fetch API)
    });
  </script>
</body>
</html>
