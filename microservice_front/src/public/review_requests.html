<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Review Requests – clearSKY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #eef2f3, #8e9eab);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      padding: 2rem;
    }
    footer {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }
    .table-wrapper {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }
    .review-form td {
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <header class="bg-dark text-white text-center py-4">
    <h1>clearSKY</h1>
    <p class="lead">Instructor Panel – Review Requests</p>
  </header>

  <main>
    <div class="table-wrapper container">
      <h4 class="mb-4">Student Review Requests</h4>
      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle" id="requestTable">
          <thead class="table-dark">
            <tr>
              <th>Course Name</th>
              <th>Examination Period</th>
              <th>Student Name</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Sample row 1 -->
            <tr>
              <td>Math 101</td>
              <td>June</td>
              <td>Maria Papadopoulou</td>
              <td><button class="btn btn-outline-primary btn-sm review-btn">Review</button></td>
            </tr>
            <!-- Sample row 2 -->
            <tr>
              <td>CS Fundamentals</td>
              <td>January</td>
              <td>Nikos Georgiou</td>
              <td><button class="btn btn-outline-primary btn-sm review-btn">Review</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 clearSKY SaaS. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const table = document.getElementById('requestTable');
    table.addEventListener('click', function (e) {
      if (e.target.classList.contains('review-btn')) {
        const button = e.target;
        const row = button.closest('tr');

        // Remove any open forms first
        document.querySelectorAll('.review-form').forEach(formRow => formRow.remove());

        // Insert new form row after this one
        const formRow = document.createElement('tr');
        formRow.classList.add('review-form');
        formRow.innerHTML = `
          <td colspan="4">
            <form class="p-3 border rounded bg-light" onsubmit="submitReview(event)">
              <div class="mb-3">
                <label class="form-label">Action</label>
                <select class="form-select" required>
                  <option value="">Select...</option>
                  <option value="approve">Approve</option>
                  <option value="reject">Reject</option>
                  <option value="clarify">Request more info</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="3" required></textarea>
              </div>
              <button type="submit" class="btn btn-success">Submit Response</button>
            </form>
          </td>
        `;
        row.insertAdjacentElement('afterend', formRow);
      }
    });

    function submitReview(event) {
      event.preventDefault();
      const form = event.target;
      const action = form.querySelector('select').value;
      const message = form.querySelector('textarea').value;

      if (!action || !message.trim()) {
        alert('Please select an action and write a message.');
        return;
      }

      alert(`Action: ${action}\nMessage: ${message}`);
      form.closest('tr').remove(); // Remove the form row after submission
    }
  </script>
</body>
</html>
