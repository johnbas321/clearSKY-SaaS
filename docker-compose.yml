review:
    build: ./microservice_review
    container_name: clearsky-review
    ports:
      - "3003:3003"
    depends_on:
      - review-db
    environment:
      - NODE_ENV=production
      - DB_HOST=review-db
      - DB_PORT=3306
      - DB_USER=clearsky
      - DB_PASSWORD=password
      - DB_NAME=review
      - PORT=3003
    networks:
      - clearsky-network
  # Redis for Auth Service
  redis:
    image: redis:alpine
    container_name: clearsky-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - clearsky-network
    restart: unless-stopped

