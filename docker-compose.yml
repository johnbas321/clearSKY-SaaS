# Database for Review Service
  review-db:
    image: mysql:8.0
    container_name: clearsky-review-db
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=review
      - MYSQL_USER=clearsky
      - MYSQL_PASSWORD=password
    volumes:
      - review-db-data:/var/lib/mysql
      - ./microservice_review/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    networks:
      - clearsky-network

networks:
  clearsky-network:
    driver: bridge

